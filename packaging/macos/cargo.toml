# Explicit packaging overlay; does not change ordinary development builds.
# For direct Cargo compilation: cargo --config packaging/macos/cargo.toml build --release
# For cargo-bundle, use the explicit target and environment in packaging/README.md;
# its child Cargo processes do not inherit command-line --config overrides.
[build]
target = "aarch64-apple-darwin"

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "15.0", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = { value = "15.0", force = true }
