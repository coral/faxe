name: Server and Go tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: stable
  CGO_ENABLED: '1'
  GOEXPERIMENT: cgocheck2

jobs:
  test:
    name: Server and Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang libclang-dev \
            libtiff-dev libjpeg-dev uuid-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf libtiff jpeg-turbo llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
          echo 'CMAKE_OSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: server-${{ matrix.os }}
          cache-on-failure: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Build Go native library
        run: |
          bindings/go/build.sh "$RUNNER_TEMP/faxe-native"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/faxe-native/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Test Go bindings and examples
        working-directory: bindings/go
        run: go test -race -count=1 -timeout=5m -v ./...
      - name: Vet Go bindings and examples
        working-directory: bindings/go
        run: go vet ./...
      - name: Test Rust engine, native transport, and FFI
        # The native SIP endpoint has one owner per process.
        run: cargo test --release --locked -p faxe-engine -p faxe-native -p faxe-ffi -- --test-threads=1
      - name: Build server examples
        run: cargo build --release --locked -p faxe-engine --examples
      - name: Test HTTP server
        run: cargo test --release --locked -p faxe-engine --example server -- --test-threads=1
