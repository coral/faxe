# Prefer MIT where a dependency offers a choice. Native libraries are also
# collected explicitly by scripts/generate-licenses.py.
accepted = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0",
    "BSL-1.0", "Unlicense", "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-only", "LGPL-2.1-only", "OpenSSL", "CDLA-Permissive-2.0",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring"]

# Read FAXE's own license directly instead of scanning generated notices or
# native sources inside workspace packages.

[faxe-desktop.clarify]
license = "GPL-3.0-only"
[[faxe-desktop.clarify.files]]
path = "LICENSE"
checksum = "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986"

